<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transportadores · APOlogistica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark app-nav shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="produtos.html"><i class="bi bi-truck-front me-2"></i>APOlogistica</a>
    <ul class="navbar-nav ms-auto flex-row flex-wrap gap-3">
      <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
      <li class="nav-item"><a class="nav-link" href="enderecos.html">Endereços</a></li>
      <li class="nav-item"><a class="nav-link" href="transportadores.html">Transportadores</a></li>
      <li class="nav-item"><a class="nav-link" href="fretes.html">Fretes</a></li>
      <li class="nav-item"><a class="nav-link" href="relatorio.html">Relatório</a></li>
    </ul>
  </div>
</nav>
<main class="container py-4">
<div id="alerta"></div>
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card"><div class="card-header"><i class="bi bi-truck me-1"></i>Transportador</div>
      <div class="card-body">
        <form id="form" autocomplete="off" class="row g-3">
          <input type="hidden" name="id">
          <div class="col-12"><label class="form-label">Nome / Razão social *</label><input name="nome" class="form-control" required></div>
          <div class="col-4"><label class="form-label">Tipo</label>
            <select name="tipo_doc" class="form-select"><option>CNPJ</option><option>CPF</option></select></div>
          <div class="col-8"><label class="form-label">Documento</label><input name="documento" class="form-control"></div>
          <div class="col-md-5"><label class="form-label">Placa do veículo</label><input name="placa" class="form-control"></div>
          <div class="col-md-7"><label class="form-label">E-mail</label><input name="email" type="email" class="form-control"></div>
          <div class="col-12">
            <label class="form-label d-flex justify-content-between">Telefones
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="adicionarTelefone()"><i class="bi bi-plus-lg"></i> Adicionar</button></label>
            <div id="telefones" class="d-grid gap-2"></div>
          </div>
          <div class="col-12">
            <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
            <button type="button" class="btn btn-outline-secondary" onclick="limpar()">Limpar</button>
          </div>
        </form>
      </div></div>
  </div>
  <div class="col-lg-7">
    <div class="card"><div class="card-header">Transportadores cadastrados</div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Nome</th><th>Contato</th><th></th></tr></thead>
        <tbody id="lista"></tbody></table></div></div>
  </div>
</div>
</main>
<script src="assets/app.js"></script>
<script src="assets/transportadores.js"></script>
</body>
</html>
