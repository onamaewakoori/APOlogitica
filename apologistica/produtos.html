<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos · APOlogistica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark app-nav shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="produtos.html"><i class="bi bi-truck-front me-2"></i>APOlogistica</a>
    <ul class="navbar-nav ms-auto flex-row flex-wrap gap-3">
      <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
      <li class="nav-item"><a class="nav-link" href="enderecos.html">Endereços</a></li>
      <li class="nav-item"><a class="nav-link" href="transportadores.html">Transportadores</a></li>
      <li class="nav-item"><a class="nav-link" href="fretes.html">Fretes</a></li>
      <li class="nav-item"><a class="nav-link" href="relatorio.html">Relatório</a></li>
    </ul>
  </div>
</nav>
<main class="container py-4">
<div id="alerta"></div>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card"><div class="card-header"><i class="bi bi-box-seam me-1"></i>Produto</div>
      <div class="card-body">
        <form id="form" autocomplete="off">
          <input type="hidden" name="id">
          <div class="mb-3"><label class="form-label">Nome *</label><input name="nome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">SKU / Código</label><input name="sku" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Descrição</label><textarea name="descricao" rows="2" class="form-control"></textarea></div>
          <div class="row">
            <div class="col mb-3"><label class="form-label">Peso (kg)</label><input name="peso" type="number" step="0.001" min="0" class="form-control"></div>
            <div class="col mb-3"><label class="form-label">Valor (R$)</label><input name="valor" type="number" step="0.01" min="0" class="form-control"></div>
          </div>
          <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
          <button type="button" class="btn btn-outline-secondary" onclick="limpar()">Limpar</button>
        </form>
      </div></div>
  </div>
  <div class="col-lg-8">
    <div class="card"><div class="card-header">Produtos cadastrados</div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Nome</th><th>SKU</th><th>Peso</th><th>Valor</th><th></th></tr></thead>
        <tbody id="lista"></tbody></table></div></div>
  </div>
</div>
</main>
<script src="assets/app.js"></script>
<script src="assets/produtos.js"></script>
</body>
</html>
