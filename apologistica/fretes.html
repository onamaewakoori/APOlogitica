<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretes · APOlogistica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark app-nav shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="produtos.html"><i class="bi bi-truck-front me-2"></i>APOlogistica</a>
    <ul class="navbar-nav ms-auto flex-row flex-wrap gap-3">
      <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
      <li class="nav-item"><a class="nav-link" href="enderecos.html">Endereços</a></li>
      <li class="nav-item"><a class="nav-link" href="transportadores.html">Transportadores</a></li>
      <li class="nav-item"><a class="nav-link" href="fretes.html">Fretes</a></li>
      <li class="nav-item"><a class="nav-link" href="relatorio.html">Relatório</a></li>
    </ul>
  </div>
</nav>
<main class="container py-4">
<div id="alerta"></div>
<form id="form" autocomplete="off" class="card mb-4">
  <div class="card-header"><i class="bi bi-clipboard-check me-1"></i>Novo frete</div>
  <div class="card-body row g-3">
    <div class="col-md-3"><label class="form-label">Data do frete *</label><input type="date" id="data_frete" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Transportador *</label><select id="transportador_id" class="form-select" required></select></div>
    <div class="col-md-3"><label class="form-label">Origem *</label><select id="origem_id" class="form-select" required></select></div>
    <div class="col-md-3"><label class="form-label">Destino *</label><select id="destino_id" class="form-select" required></select></div>
    <div class="col-12">
      <label class="form-label d-flex justify-content-between align-items-center">Produtos transportados (1 transportador → vários produtos)
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="adicionarProduto()"><i class="bi bi-plus-lg"></i> Adicionar produto</button></label>
      <div id="itens"></div>
    </div>
  </div>
  <div class="card-footer bg-transparent border-0 pb-3">
    <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Gerar frete</button>
  </div>
</form>
<div class="card"><div class="card-header">Fretes gerados</div>
  <div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>ID</th><th>Data</th><th>Transportador</th><th>Origem → Destino</th><th>Produtos</th><th></th></tr></thead>
    <tbody id="lista"></tbody></table></div></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/fretes.js"></script>
</body>
</html>
